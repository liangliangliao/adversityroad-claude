name: Import CC0 Universal Animation Library to Anims2

on:
  push:
    branches:
      - asset/import-ual-anims2
    paths:
      - '.github/workflows/import-ual-anims2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Quaternius Universal Animation Library Standard
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/quaternius-ual
          git clone https://github.com/IAFahim/quaternius.universalAnimationLibrary.standard.git /tmp/quaternius-ual
          git -C /tmp/quaternius-ual checkout 8456155dbae7eb861f553a2341871ccae633c857

      - name: Copy CC0 animation pack into Anims2
        shell: bash
        run: |
          set -euo pipefail
          target='Assets/_Project/Resources/Characters/Anims2'
          mkdir -p "$target"
          cp /tmp/quaternius-ual/UAL1_Standard.fbx "$target/UAL1_Standard.fbx"
          cp /tmp/quaternius-ual/LICENSE "$target/QUATERNIUS_UAL_CC0_LICENSE.txt"
          cat > "$target/QUATERNIUS_UAL_SOURCE.md" <<'EOF'
          # Quaternius Universal Animation Library — Standard

          Source: https://quaternius.com/packs/universalanimationlibrary.html
          GitHub mirror used for reproducible import: https://github.com/IAFahim/quaternius.universalAnimationLibrary.standard
          Pinned source commit: `8456155dbae7eb861f553a2341871ccae633c857`
          Imported asset: `UAL1_Standard.fbx`

          The publisher describes the Universal Animation Library as a 120+ humanoid-animation library compatible with Unity and common rigs including Mixamo. It includes locomotion, sitting, combat, emotes and other actions.

          License: CC0 1.0 Universal. See `QUATERNIUS_UAL_CC0_LICENSE.txt` in this directory.
          EOF

      - name: Commit imported assets to this branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/_Project/Resources/Characters/Anims2/UAL1_Standard.fbx \
                  Assets/_Project/Resources/Characters/Anims2/QUATERNIUS_UAL_CC0_LICENSE.txt \
                  Assets/_Project/Resources/Characters/Anims2/QUATERNIUS_UAL_SOURCE.md
          if git diff --cached --quiet; then
            echo 'Assets already imported; nothing to commit.'
            exit 0
          fi
          git commit -m 'assets: add CC0 universal animation library to Anims2'
          git push origin "HEAD:${GITHUB_REF_NAME}"
