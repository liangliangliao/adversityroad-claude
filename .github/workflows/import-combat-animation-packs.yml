name: Import CC0 Combat Animation Packs

on:
  push:
    branches:
      - asset/add-ual2-combat-packs-anims2
    paths:
      - .github/workflows/import-combat-animation-packs.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout asset branch
        uses: actions/checkout@v4
        with:
          ref: asset/add-ual2-combat-packs-anims2
          fetch-depth: 0

      - name: Download pinned CC0 FBX packs into Anims2
        shell: bash
        run: |
          set -euo pipefail
          dest='Assets/_Project/Resources/Characters/Anims2'
          mkdir -p "$dest"

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/IBimsHedebe/The-last-World/40ff2658496c7f69e0c50482b2a8f8153cc7d261/addons/Universal%20Animation%20Library%202%5BStandard%5D/Unity/UAL2_Standard.fbx' \
            -o "$dest/UAL2_Standard.fbx"

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/IBimsHedebe/The-last-World/40ff2658496c7f69e0c50482b2a8f8153cc7d261/addons/Universal%20Animation%20Library%202%5BStandard%5D/Unity/UAL2_Standard_RM.fbx' \
            -o "$dest/UAL2_Standard_RM.fbx"

          curl --fail --location --retry 3 \
            'https://raw.githubusercontent.com/IBimsHedebe/The-last-World/40ff2658496c7f69e0c50482b2a8f8153cc7d261/addons/Universal%20Animation%20Library%5BStandard%5D/Unity/UAL1_Standard_RM.fbx' \
            -o "$dest/UAL1_Standard_RM.fbx"

          test "$(stat -c%s "$dest/UAL2_Standard.fbx")" = '24778332'
          test "$(stat -c%s "$dest/UAL2_Standard_RM.fbx")" = '24805740'
          test "$(stat -c%s "$dest/UAL1_Standard_RM.fbx")" = '23767852'

      - name: Commit animation packs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Assets/_Project/Resources/Characters/Anims2/UAL2_Standard.fbx \
                  Assets/_Project/Resources/Characters/Anims2/UAL2_Standard_RM.fbx \
                  Assets/_Project/Resources/Characters/Anims2/UAL1_Standard_RM.fbx
          if git diff --cached --quiet; then
            echo 'Animation assets already present.'
            exit 0
          fi
          git commit -m 'assets: add Quaternius UAL2 and root-motion animation packs'
          git push origin HEAD:asset/add-ual2-combat-packs-anims2
